# =============================================================================
# HYPRLOCK CONFIGURATION - CACHYOS / IAN
# Estilo minimalista / Paleta Waybar & SDDM (MesloLGS Nerd Font + Minimal Square)
# =============================================================================

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

background {
    monitor = 
    path = /home/ian/dotfiles/wallpapers/polar-bear.jpg
    blur_passes = 0
    blur_size = 0
}

# -----------------------------------------------------------------------------
# Relógio (Horário)
# -----------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_family = MesloLGS Nerd Font Bold
    font_size = 112
    color = rgba(205, 214, 244, 1.0)       # Ice (#cdd6f4)
    shadow_passes = 0
    shadow_size = 0
    shadow_color = rgba(0, 0, 0, 0.8)
    position = 60, 50
    halign = left
    valign = center
}

# -----------------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------------
label {
    monitor = 
    text = cmd[update:60000] date +"%d/%m/%Y"
    font_family = MesloLGS Nerd Font
    font_size = 22
    color = rgba(137, 180, 250, 1.0)       # Calm Blue (#89b4fa)
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.8)
    position = 188, -42
    halign = left
    valign = center
}

# -----------------------------------------------------------------------------
# Campo de Senha (Estilo Minimal Square)
# -----------------------------------------------------------------------------
input-field {
    monitor = 
    size = 230, 38
    position = 157, -140
    halign = left
    valign = center
    outline_thickness = 2

    rounding = 0                           # Minimal Square (combinando com SDDM e Hyprland)
    outer_color = rgba(137, 180, 250, 0.8) # Calm Blue (#89b4fa)
    inner_color = rgba(17, 17, 27, 0.65)   # Black translúcido (#11111b)
    font_color = rgba(205, 214, 244, 1.0)  # Ice (#cdd6f4)
    check_color = rgba(116, 199, 236, 1.0) # Pacific Blue (#74c7ec)

    font_family = MesloLGS Nerd Font
    placeholder_text = Digite a senha
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false

    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_color = rgba(243, 139, 168, 1.0)  # Red (#f38ba8)
    fail_transition = 300
}
