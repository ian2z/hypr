# =============================================================================
# HYPRLOCK CONFIGURATION - CACHYOS / IAN
# Estilo Dynamic Island Glass (MesloLGS Nerd Font + Pill Rounded Design)
# =============================================================================

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

background {
    monitor = 
    path = /home/ian/hypr/wallpapers/polar-bear.jpg
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# -----------------------------------------------------------------------------
# Relógio Central (Horário)
# -----------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_family = MesloLGS Nerd Font Bold
    font_size = 84
    color = rgba(205, 214, 244, 1.0)       # Ice (#cdd6f4)
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
    position = 0, 140
    halign = center
    valign = center
}

# -----------------------------------------------------------------------------
# Data (Cápsula / Badge de Data)
# -----------------------------------------------------------------------------
label {
    monitor = 
    text = cmd[update:60000] LC_TIME="pt_BR.UTF-8" date +"%A, %d de %B"
    font_family = MesloLGS Nerd Font
    font_size = 17
    color = rgba(137, 180, 250, 1.0)       # Calm Blue (#89b4fa)
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.5)
    position = 0, 65
    halign = center
    valign = center
}

# -----------------------------------------------------------------------------
# Campo de Senha (Estilo Dynamic Island Pill)
# -----------------------------------------------------------------------------
input-field {
    monitor = 
    size = 280, 48
    position = 0, -35
    halign = center
    valign = center
    outline_thickness = 1

    rounding = -1                           # Pílula 100% arredondada (Dynamic Island style)
    outer_color = rgba(137, 180, 250, 0.75) # Calm Blue (#89b4fa)
    inner_color = rgba(24, 24, 37, 0.80)    # Card Dark translúcido (#181825)
    font_color = rgba(205, 214, 244, 1.0)   # Ice (#cdd6f4)
    check_color = rgba(116, 199, 236, 1.0)  # Pacific Blue (#74c7ec)

    font_family = MesloLGS Nerd Font
    placeholder_text = <span foreground="##9399b2">󰌾  Digite a senha...</span>
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false

    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_color = rgba(243, 139, 168, 1.0)  # Red (#f38ba8)
    fail_transition = 300
}

# -----------------------------------------------------------------------------
# Indicador Inferior de Sessão Bloqueada
# -----------------------------------------------------------------------------
label {
    monitor = 
    text = 󰌾 Sessão Bloqueada
    font_family = MesloLGS Nerd Font
    font_size = 11
    color = rgba(147, 153, 178, 0.85)      # Muted (#9399b2)
    position = 0, -100
    halign = center
    valign = center
}
