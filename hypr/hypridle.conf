# =============================================================================
# HYPRIDLE CONFIGURATION - CACHYOS / IAN
# Gerenciamento de Ociosidade, Bloqueio e Energia
# =============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock       # Evita abrir múltiplas instâncias do hyprlock
    before_sleep_cmd = loginctl lock-session    # Garante que bloqueia a tela antes de suspender
    after_sleep_cmd = hyprctl dispatch dpms on  # Acende os monitores ao retornar da suspensão
    inhibit_sleep = 3                           # Espera o bloqueio concluir antes de suspender
}

# 1. Bloqueio de tela após 15 minutos (900 segundos) de inatividade
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# 2. Desligar monitores (DPMS) 30s após o bloqueio (930 segundos) para economizar energia
listener {
    timeout = 930
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 3. Suspender o sistema após 2 horas (7200 segundos) de inatividade total
listener {
    timeout = 7200
    on-timeout = systemctl suspend
}
